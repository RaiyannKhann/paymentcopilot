services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: paymentcopilot
      POSTGRES_USER: ${POSTGRES_USER:-paymentcopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paymentcopilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paymentcopilot}"]
      interval: 5s
      timeout: 3s
      retries: 5

  seed:
    build: .
    command: python scripts/seed_transactions.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paymentcopilot}:${POSTGRES_PASSWORD:-paymentcopilot}@postgres:5432/paymentcopilot
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paymentcopilot}:${POSTGRES_PASSWORD:-paymentcopilot}@postgres:5432/paymentcopilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
