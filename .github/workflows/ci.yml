name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values: config.py requires these at import time, but every
      # test mocks the Anthropic/Pinecone/Postgres call sites directly —
      # no live services or real credentials are needed to run the suite.
      ANTHROPIC_API_KEY: ci-dummy-key
      PINECONE_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q
